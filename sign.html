<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .portal-card {
            border: none;
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-check-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            transition: opacity 0.2s ease;
        }
        .btn-gradient:hover {
            color: white;
            opacity: 0.9;
        }
        .info-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8898aa;
            margin-bottom: 2px;
        }
        .info-value {
            font-size: 1.1rem;
            color: #32325d;
            font-weight: 500;
        }
        .profile-avatar {
            width: 70px;
            height: 70px;
            background-color: #e0e7ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 2rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="row mb-5 text-center">
        <div class="col">
            <h1 class="fw-extrabold text-dark" style="letter-spacing: -1px;">Registration Form</h1>
            
        </div>
    </div>

    <div class="row g-4 justify-content-center">
        
        <div class="col-12 col-lg-5">
            <div class="card portal-card shadow-sm p-4 bg-white">
                <h4 class="mb-4 text-dark fw-bold"><i class="bi bi-pencil-square me-2 text-indigo"></i>Account Details</h4>
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Full Name</label>
                    <input type="text" id="uname" class="form-control form-control-lg" placeholder="abcd">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Email Address</label>
                    <input type="email" id="email" class="form-control form-control-lg" placeholder="@example.com">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Date of Birth</label>
                    <input type="date" id="dob" class="form-control form-control-lg">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary d-block">Gender</label>
                    <div class="d-flex gap-3 mt-2">
                        <div class="form-check">
                            <input type="radio" name="gender" value="Male" id="genderMale" class="form-check-input">
                            <label class="form-check-label" for="genderMale">Male</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="gender" value="Female" id="genderFemale" class="form-check-input">
                            <label class="form-check-label" for="genderFemale">Female</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="gender" value="Other" id="genderOther" class="form-check-input">
                            <label class="form-check-label" for="genderOther">Other</label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">Residential Address</label>
                    <textarea id="address" class="form-control form-control-lg" rows="3" placeholder="Street, City, State"></textarea>
                </div>

                <button onclick="updateDisplayProfile()" class="btn btn-gradient btn-lg w-100 fw-bold py-2 shadow">
                    Generate Profile <i class="bi bi-arrow-right-short ms-1"></i>
                </button>
            </div>
        </div>

        <div class="col-12 col-lg-5">
            <div class="card portal-card shadow-sm bg-white overflow-hidden h-100">
                <div style="height: 10px; background: linear-gradient(90deg, #4f46e5 0%, #6366f1 100%);"></div>
                
                <div class="card-body p-4 d-flex flex-column align-items-center text-center">
                    <div class="profile-avatar shadow-sm" id="avatarBox">
                        <i class="bi bi-person"></i>
                    </div>
                    
                    <h3 id="rname" class="fw-bold text-dark mb-1">User</h3>
                    <p id="remail" class="text-muted small mb-4">No email connected</p>
                    
                    <div class="w-100 border-top my-2"></div>

                    <div class="w-100 text-start mt-3">
                        <div class="row mb-3">
                            <div class="col-6">
                                <div class="info-label"><i class="bi bi-calendar3 me-1"></i> Birthdate</div>
                                <div id="rdob" class="info-value text-truncate">—</div>
                            </div>
                            <div class="col-6">
                                <div class="info-label"><i class="bi bi-gender-ambiguous me-1"></i> Gender</div>
                                <div id="rgender" class="info-value text-truncate">—</div>
                            </div>
                        </div>

                        <div class="mb-2">
                            <div class="info-label"><i class="bi bi-geo-alt me-1"></i> Verified Address</div>
                            <div id="raddress" class="info-value text-wrap" style="min-height: 50px; font-size:1rem; color:#525f7f;">
                                —
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script>
function updateDisplayProfile() {
    var name = document.getElementById("uname").value.trim();
    var email = document.getElementById("email").value.trim();
    var dob = document.getElementById("dob").value;
    var address = document.getElementById("address").value.trim();
    var gender = document.querySelector('input[name="gender"]:checked');

    
    document.getElementById("rname").innerText = name ? name : "Guest User";
    document.getElementById("remail").innerText = email ? email : "No email connected";
    document.getElementById("rdob").innerText = dob ? formatDate(dob) : "—";
    document.getElementById("raddress").innerText = address ? address : "—";
    document.getElementById("rgender").innerText = gender ? gender.value : "—";

    var avatar = document.getElementById("avatarBox");
    if (name) {
        avatar.style.backgroundColor = "#d1fae5";
        avatar.style.color = "#059669";
        avatar.innerHTML = `<i class="bi bi-person-check-fill"></i>`;
    } else {
        avatar.style.backgroundColor = "#e0e7ff";
        avatar.style.color = "#4f46e5";
        avatar.innerHTML = `<i class="bi bi-person"></i>`;
    }
}

function formatDate(inputDate) {
    if(!inputDate) return "—";
    const dateObj = new Date(inputDate);
    return dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}
</script>

</body>
</html>
